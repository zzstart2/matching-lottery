<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>相亲活动摇号系统</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap">
    <link rel="icon" href="img/heart.png">
    <style>
        .session-note {
            text-align: center;
            margin-top: 10px;
            color: #777;
            font-size: 14px;
            font-style: italic;
        }
        .controls {
            text-align: center;
            margin-top: 20px;
            padding-bottom: 20px;
        }
        
        /* 针对10:4屏幕比例的特殊样式 */
        @media (min-aspect-ratio: 9/4) {
            body {
                background: linear-gradient(135deg, #ffdbea 0%, #cee5ff 100%);
                padding: 0;
                margin: 0;
                height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                overflow: hidden;
            }
            
            /* 整体容器调整 */
            .container {
                width: 90%;
                height: 80vh;
                max-height: 800px;
                margin: 0 auto;
                display: flex;
                flex-direction: column;
                justify-content: center;
                border-radius: 20px;
                box-shadow: 0 10px 50px rgba(0, 0, 0, 0.2);
                background-color: rgba(255, 255, 255, 0.7);
                padding: 20px;
            }
            
            /* 头部样式增强 */
            header {
                margin-bottom: 30px;
                display: flex;
                justify-content: flex-end;
                padding: 20px;
            }
            
            .header-spacer {
                flex-grow: 1;
            }
            
            .settings-button {
                cursor: pointer;
                padding: 8px 15px;
                font-size: 16px;
                border-radius: 5px;
                background-color: #f0f0f0;
                border: 1px solid #ddd;
                transition: all 0.3s;
                z-index: 100;
            }
            
            .settings-button:hover {
                background-color: #e0e0e0;
            }
            
            /* 抽奖容器横向布局调整 */
            .lottery-container {
                display: flex;
                justify-content: center;
                gap: 15%;
                margin: 0 auto;
                width: 100%;
                height: 60%;
            }
            
            /* 女生和男生区域尺寸调整 */
            .female-section, .male-section {
                width: 35%;
                padding: 40px;
                border-radius: 20px;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                box-shadow: 0 5px 25px rgba(0, 0, 0, 0.1);
            }
            
            .female-section {
                background-color: rgba(255, 182, 193, 0.4);
            }
            
            .male-section {
                background-color: rgba(135, 206, 235, 0.4);
            }
            
            /* 号码显示调整 */
            .number {
                width: 250px;
                height: 250px;
                line-height: 250px; /* 使数字垂直居中 */
                font-size: 8rem !important;
                font-weight: 700;
                margin: 30px auto;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            }
            
            /* 标题调整 */
            .title {
                font-size: 4.5rem !important;
                text-align: center;
                font-weight: 700;
                margin-bottom: 20px;
                background: linear-gradient(45deg, #ff4d7e, #4785ba);
                -webkit-background-clip: text;
                background-clip: text;
                color: transparent;
                text-shadow: 0 2px 5px rgba(0,0,0,0.1);
            }
            
            /* 分区标题调整 */
            .section-title {
                font-size: 2.5rem !important;
                margin-bottom: 20px;
                font-weight: 700;
            }
            
            /* 控制按钮调整 */
            .control-button {
                font-size: 2.5rem;
                padding: 20px 80px;
                margin-top: 40px;
                border-radius: 50px;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
                font-weight: 600;
                letter-spacing: 5px;
            }
            
            /* 结果显示调整 */
            .result-container {
                height: 60%;
            }
            
            .result-text {
                font-size: 7rem !important;
                font-weight: 700;
                background: linear-gradient(45deg, #ff4d7e, #4785ba);
                -webkit-background-clip: text;
                background-clip: text;
                color: transparent;
                text-shadow: 0 5px 10px rgba(0,0,0,0.1);
            }
            
            /* 设置面板调整 */
            .settings-panel {
                position: absolute;
                width: 70%;
                height: 80vh;
                left: 15%;
                top: 10vh;
                border-radius: 20px;
                box-shadow: 0 10px 50px rgba(0, 0, 0, 0.3);
                background-color: white;
                z-index: 1000;
                padding: 30px;
                overflow-y: auto;
            }
            
            #settings-panel {
                display: none;
            }
            
            .settings-title {
                font-size: 3.5rem !important;
                margin-bottom: 40px;
            }
            
            .settings-item {
                margin-bottom: 30px;
                font-size: 2rem;
            }
            
            .settings-item input {
                width: 150px;
                height: 60px;
                font-size: 2rem;
                text-align: center;
            }
            
            .range-separator {
                font-size: 2rem;
                margin: 0 20px;
            }
            
            .settings-buttons {
                margin-top: 60px;
            }
            
            .save-button, .cancel-button {
                padding: 15px 50px;
                font-size: 2rem;
                border-radius: 10px;
                margin: 0 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-spacer"></div>
            <button id="settings-button" class="settings-button" onclick="document.getElementById('settings-panel').style.display='block';document.getElementById('main-content').style.display='none';">设置</button>
        </header>

        <main id="main-content">
            <div class="lottery-container">
                <div class="female-section">
                    <h2 class="section-title female-color">女生号码</h2>
                    <div class="number female-number" id="female-number">1</div>
                </div>
                
                <div class="male-section">
                    <h2 class="section-title male-color">男生号码</h2>
                    <div class="number male-number" id="male-number">1</div>
                </div>
            </div>

            <div class="result-container" id="result-container" style="display: none;">
                <div class="result-text" id="result-text"></div>
            </div>
            
            <div class="controls">
                <button id="control-button" class="control-button" onclick="handleControlButtonClick()">开始</button>
            </div>
        </main>

        <div id="settings-panel" class="settings-panel" style="display: none;">
            <h2 class="settings-title">设置</h2>
            
            <div class="settings-group">
                <div class="settings-item">
                    <label>女生号码范围</label>
                    <div class="range-inputs">
                        <input type="number" id="female-min" min="1" value="1">
                        <span class="range-separator">到</span>
                        <input type="number" id="female-max" min="1" value="103">
                    </div>
                </div>
                
                <div class="settings-item">
                    <label>男生号码范围</label>
                    <div class="range-inputs">
                        <input type="number" id="male-min" min="1" value="1">
                        <span class="range-separator">到</span>
                        <input type="number" id="male-max" min="1" value="73">
                    </div>
                </div>
                
                <div class="settings-item">
                    <label>标题字号</label>
                    <input type="number" id="title-size" min="16" max="72" value="48">
                </div>
                
                <div class="settings-item">
                    <label>数字字号</label>
                    <input type="number" id="number-size" min="16" max="160" value="80">
                </div>
                
                <div class="settings-item">
                    <label>标签字号</label>
                    <input type="number" id="label-size" min="12" max="48" value="28">
                </div>
            </div>
            
            <div class="settings-buttons">
                <button id="save-settings" class="save-button" onclick="handleSaveSettings()">保存并返回</button>
                <button id="cancel-settings" class="cancel-button" onclick="document.getElementById('settings-panel').style.display='none';document.getElementById('main-content').style.display='flex';">取消</button>
            </div>
        </div>
    </div>

    <script>
        // 内联JavaScript，确保设置面板功能正常工作
        // 控制按钮状态
        let state = {
            rolling: false,
            rollInterval: null,
            selectedFemale: null,
            selectedMale: null,
            step: 0,  // 0: 初始状态, 1: 停止滚动, 2: 显示结果
        };
        
        // 控制按钮点击处理
        function handleControlButtonClick() {
            const controlButton = document.getElementById('control-button');
            const femaleNumber = document.getElementById('female-number');
            const maleNumber = document.getElementById('male-number');
            const resultContainer = document.getElementById('result-container');
            const resultText = document.getElementById('result-text');
            const settings = JSON.parse(localStorage.getItem('matchingLotterySettings')) || {
                femaleRange: { min: 1, max: 103 },
                maleRange: { min: 1, max: 73 }
            };
            
            switch (state.step) {
                case 0: // 开始滚动
                    state.rolling = true;
                    state.step = 1;
                    controlButton.textContent = '停止';
                    
                    state.rollInterval = setInterval(() => {
                        // 随机选择号码
                        const femaleRandomNumber = Math.floor(Math.random() * (settings.femaleRange.max - settings.femaleRange.min + 1)) + settings.femaleRange.min;
                        const maleRandomNumber = Math.floor(Math.random() * (settings.maleRange.max - settings.maleRange.min + 1)) + settings.maleRange.min;
                        
                        femaleNumber.textContent = femaleRandomNumber;
                        maleNumber.textContent = maleRandomNumber;
                    }, 50);
                    break;
                    
                case 1: // 停止滚动
                    if (state.rollInterval) {
                        clearInterval(state.rollInterval);
                        state.rollInterval = null;
                    }
                    
                    state.rolling = false;
                    state.step = 2;
                    state.selectedFemale = parseInt(femaleNumber.textContent);
                    state.selectedMale = parseInt(maleNumber.textContent);
                    
                    // 隐藏主抽奖容器，显示结果容器
                    document.querySelector('.lottery-container').style.display = 'none';
                    resultContainer.style.display = 'flex';
                    
                    // 创建心形符号
                    resultText.innerHTML = `${state.selectedFemale} <span style="color: #ff4d7e;">❤</span> ${state.selectedMale}`;
                    
                    controlButton.textContent = '重新开始';
                    break;
                    
                case 2: // 重新开始
                    state.step = 0;
                    state.selectedFemale = null;
                    state.selectedMale = null;
                    
                    // 重置UI
                    document.querySelector('.lottery-container').style.display = 'flex';
                    resultContainer.style.display = 'none';
                    
                    // 自动开始新的滚动
                    handleControlButtonClick();
                    break;
            }
        }
        
        function handleSaveSettings() {
            // 验证和获取输入值
            const femaleMin = Math.max(1, parseInt(document.getElementById('female-min').value) || 1);
            const femaleMax = Math.max(femaleMin, parseInt(document.getElementById('female-max').value) || 103);
            const maleMin = Math.max(1, parseInt(document.getElementById('male-min').value) || 1);
            const maleMax = Math.max(maleMin, parseInt(document.getElementById('male-max').value) || 73);
            
            const titleSize = Math.max(16, Math.min(72, parseInt(document.getElementById('title-size').value) || 48));
            const numberSize = Math.max(16, Math.min(160, parseInt(document.getElementById('number-size').value) || 80));
            const labelSize = Math.max(12, Math.min(48, parseInt(document.getElementById('label-size').value) || 28));
            
            // 更新设置
            let settings = {
                femaleRange: { min: femaleMin, max: femaleMax },
                maleRange: { min: maleMin, max: maleMax },
                fontSize: {
                    title: titleSize,
                    number: numberSize,
                    label: labelSize
                }
            };
            
            // 保存设置
            localStorage.setItem('matchingLotterySettings', JSON.stringify(settings));
            
            // 关闭设置面板
            document.getElementById('settings-panel').style.display = 'none';
            document.getElementById('main-content').style.display = 'flex';
            
            // 刷新页面以应用设置
            location.reload();
        }
    </script>
</body>
</html>
