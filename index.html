<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>南望山之恋</title>
    <link rel="stylesheet" href="css/style.css?v=1.0.3">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap">
    <link rel="icon" href="img/heart.png">
    <style>
        /* 基础样式 */
        body {
            background: url('img/bg.png') no-repeat center center fixed;
            background-size: cover;
            padding: 0;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            font-family: 'Noto Sans SC', sans-serif;
        }
        
        #main-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
        }
        
        /* 整体容器样式 */
        .container {
            width: 90%;
            height: 90vh;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
            border-radius: 20px;
            background-color: transparent;
            padding: 20px;
            position: relative;
            z-index: 10;
        }
        
        /* 头部样式 */
        header {
            margin-bottom: 30px;
            display: flex;
            justify-content: flex-end;
            padding: 20px;
        }
        
        .header-spacer {
            flex-grow: 1;
        }
        
        .header-buttons {
            position: absolute;
            top: 15px;
            right: 15px;
            display: flex;
            gap: 30px;
        }
        
        /* 设置按钮定位方式改为相对固定位置 */
        #records-button {
            position: absolute;
            right: 180px;
            width: 120px;
            text-align: center;
        }
        
        #settings-button {
            position: absolute;
            right: 40px;
            width: 120px;
            text-align: center;
        }
        
        /* 设置按钮基本样式 */
        .settings-button {
            background-color: rgba(255, 255, 255, 0.5);
            color: #555;
            font-size: 14px;
            padding: 6px 12px;
            opacity: 0.8;
            cursor: pointer;
            border-radius: 5px;
            border: none;
            transition: all 0.3s;
        }
        
        .settings-button:hover {
            background-color: white;
            transform: translateY(-2px);
        }
        
        /* 主内容区域 */
        main {
            margin-top: 120px;
            position: relative;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
        }
        
        /* 抽奖容器样式 */
        .lottery-container {
            display: flex;
            gap: 5%;
            margin: 0 auto;
            width: 100%;
            height: 50%;
            padding-top: 80px;
            justify-content: center;
            position: relative;
        }
        
        /* 心形匹配动画 */
        .heart-animation {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 100px;
            color: #ff4d7e;
            opacity: 0;
            z-index: 10;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
            transition: all 0.5s ease;
        }
        
        .heart-animation.active {
            animation: heartBeat 1s ease-in-out;
            opacity: 1;
        }
        
        @keyframes heartBeat {
            0% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }
        
        /* 女生和男生区域样式 */
        .female-section, .male-section {
            width: 35%;
            padding: 10px;
            border-radius: 160px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            position: relative;
        }
        
        .female-section {
            background-color: rgba(255, 255, 255, 0.1); 
            border: 3px solid transparent;
            background-clip: padding-box;
        }
        
        .female-section::before {
            content: '';
            position: absolute;
            top: -3px;
            right: -3px;
            bottom: -3px;
            left: -3px;
            z-index: -1;
            border-radius: 160px;
            background: linear-gradient(to right, rgba(255, 154, 158, 0.3), rgba(250, 208, 196, 0.3));
        }
        
        .male-section {
            background-color: rgba(255, 255, 255, 0.1);
            border: 3px solid transparent;
            background-clip: padding-box;
        }
        
        .male-section::before {
            content: '';
            position: absolute;
            top: -3px;
            right: -3px;
            bottom: -3px;
            left: -3px;
            z-index: -1;
            border-radius: 160px;
            background: linear-gradient(to right, rgba(143, 211, 244, 0.3), rgba(74, 157, 207, 0.3));
        }
        
        /* 号码显示样式 */
        .number {
            width: 220px;
            height: 130px;
            line-height: 130px;
            font-size: 7rem !important;
            font-weight: 700;
            margin: 10px auto;
            text-align: center;
            color: white;
            background-clip: text;
            -webkit-background-clip: text;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.7), 0 0 20px rgba(255, 255, 255, 0.5), 0 0 30px rgba(255, 255, 255, 0.3);
        }
        
        .female-number {
            color: #ff9a9e;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.9), 0 0 20px rgba(255, 255, 255, 0.7), 0 0 30px rgba(255, 255, 255, 0.5);
        }
        
        .male-number {
            color: #8fd3f4;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.9), 0 0 20px rgba(255, 255, 255, 0.7), 0 0 30px rgba(255, 255, 255, 0.5);
        }
        
        /* 分区标题样式 */
        .section-title {
            font-size: 2.5rem !important;
            margin-bottom: 5px;
            font-weight: 700;
            color: #666;
        }
        
        .female-color {
            color: #ff7b8a;
        }
        
        .male-color {
            color: #4a9dcf;
        }
        
        /* 控制按钮样式 */
        .controls {
            height: 150px !important;
            display: flex !important;
            justify-content: center !important;
            align-items: center !important;
            margin-top: 60px !important;
            gap: 20px !important;
            padding-bottom: 30px !important;
        }
        
        .control-button {
            font-size: 2.5rem !important;
            padding: 20px 0 !important;
            margin-top: 0 !important;
            border-radius: 50px !important;
            font-weight: 600 !important;
            letter-spacing: 5px !important;
            width: 230px !important;
            height: 100px !important;
            position: relative !important;
            text-align: center !important;
            transition: all 0.3s !important;
            display: inline-block !important;
            margin: 0 10px !important;
            backdrop-filter: blur(5px) !important;
            border: none !important;
            color: white !important;
            line-height: 60px !important;
        }
        
        .white-button {
            background-color: #4785ba !important;
            color: white !important;
            text-shadow: none !important;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1) !important;
        }
        
        .batch-button {
            background: linear-gradient(45deg, #ff4d7e, #4785ba) !important;
            color: white !important;
        }
        
        .control-button:hover {
            transform: translateY(-3px);
        }
        
        /* 重新开始按钮样式 */
        .reset-button {
            font-size: 1.5rem;
            margin-top: 0;
            margin-left: 20px;
            font-weight: 500;
            text-align: center;
            transition: all 0.3s;
            display: none;
            background: none;
            color: #777;
            border: none;
            cursor: pointer;
            text-decoration: underline;
            padding: 5px 10px;
        }
        
        .reset-button:hover {
            color: #f44336;
        }
        
        /* 结果容器样式 */
        .result-container {
            position: fixed;
            width: 70%;
            height: 80vh;
            left: 15%;
            top: 50%;
            transform: translateY(-50%);
            border-radius: 20px;
            background-color: white;
            z-index: 1000;
            padding: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        
        .result-title {
            font-size: 2.2rem;
            font-weight: bold;
            color: #333;
            width: 100%;
            text-align: center;
            border-bottom: 1px solid #eee;
            padding: 20px 0;
            margin: 0;
            background-color: white;
            position: sticky;
            top: 0;
            z-index: 5;
        }
        
        .result-content {
            flex: 1;
            width: 100%;
            overflow-y: auto;
            padding: 20px;
            background-color: rgba(255, 255, 255, 0.5);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 30px;
            scroll-behavior: smooth;
        }
        
        .result-text {
            font-size: 4.5rem;
            font-weight: bold;
            color: #333;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        
        .result-actions {
            display: flex;
            justify-content: center;
            gap: 30px;
            position: sticky;
            bottom: 0;
            background-color: white;
            padding: 20px 0;
            border-top: 1px solid #eee;
            margin: 0;
            z-index: 5;
            width: 100%;
        }
        
        .result-close-btn, .result-clear-btn {
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 1.2rem;
            cursor: pointer;
            border: none;
            transition: all 0.3s;
        }
        
        .result-close-btn {
            background-color: #4785ba;
            color: white;
        }
        
        .result-clear-btn {
            background-color: #ff4d7e;
            color: white;
        }
        
        .result-close-btn:hover, .result-clear-btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }
        
        /* 批量抽取结果样式 */
        .batch-results {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            max-height: 70vh;
            overflow-y: auto;
            gap: 40px;
            padding: 20px;
            margin: 0 auto;
            scroll-behavior: smooth;
        }
        
        .batch-result-item {
            font-size: 3.2rem;
            padding: 15px 30px;
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.9);
            min-width: 280px;
            height: 100px;
            text-align: center;
            flex: 0 0 auto;
            margin: 15px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 700;
            color: #333;
            white-space: nowrap;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            border: 2px solid rgba(255, 77, 126, 0.3);
        }
        
        /* 记录列表样式 */
        .records-container {
            margin: 20px auto 0;
            width: 90%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 20px 40px 20px;
            justify-content: center;
        }
        
        .records-list {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            text-align: center;
            padding: 10px;
        }
        
        .record-item {
            background: linear-gradient(45deg, rgba(255, 182, 193, 0.4), rgba(135, 206, 235, 0.4));
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 1.2rem;
            display: inline-flex;
            align-items: center;
            min-width: 120px;
            justify-content: center;
            margin: 8px;
            white-space: nowrap;
        }
        
        .record-heart {
            color: #ff4d7e;
            margin: 0 8px;
            font-size: 1.3rem;
        }
        
        .record-time {
            font-size: 0.8rem;
            color: #888;
            margin-top: 4px;
        }
        
        .no-records {
            text-align: center;
            padding: 30px;
            color: #888;
            font-style: italic;
        }
        
        .records-count-badge {
            font-size: 1.2rem;
            color: #888;
            font-weight: normal;
            margin-left: 15px;
        }
        
        .records-list-container {
            flex: 1;
            width: 100%;
            height: calc(100% - 160px); 
            overflow-y: auto;
            padding: 20px;
            padding-bottom: 40px;
            background-color: rgba(255, 255, 255, 0.5);
            scroll-behavior: smooth;
        }
        
        /* 设置面板样式 */
        .settings-panel {
            position: fixed;
            width: 70%;
            height: 80vh;
            left: 15%;
            top: 50%;
            transform: translateY(-50%);
            border-radius: 20px;
            background-color: white;
            z-index: 1000;
            padding: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        
        .settings-title {
            font-size: 3.5rem !important;
            font-weight: bold;
            color: #333;
            width: 100%;
            text-align: center;
            border-bottom: 1px solid #eee;
            padding: 20px 0;
            margin: 0;
            background-color: white;
            position: sticky;
            top: 0;
            z-index: 5;
        }
        
        .settings-group {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            align-items: center;
        }
        
        .settings-item {
            margin-bottom: 30px;
            font-size: 2rem;
            padding: 0 15px;
            box-sizing: border-box;
            width: 80%;
        }
        
        .settings-item input {
            width: 150px;
            height: 60px;
            font-size: 2rem;
            text-align: center;
        }
        
        .range-separator {
            font-size: 2rem;
            margin: 0 20px;
        }
        
        .settings-buttons {
            display: flex;
            justify-content: center;
            gap: 30px;
            position: sticky;
            bottom: 0;
            background-color: white;
            padding: 20px 0;
            border-top: 1px solid #eee;
            margin: 0;
            z-index: 5;
            width: 100%;
        }
        
        .save-button, .cancel-button {
            padding: 15px 40px;
            font-size: 1.8rem;
            border-radius: 10px;
            cursor: pointer;
            border: none;
        }
        
        .save-button {
            background-color: #4CAF50;
            color: white;
        }
        
        .cancel-button {
            background-color: #f44336;
            color: white;
        }
        
        /* 结果项样式 */
        .result-item {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-width: 260px;
            min-height: 140px;
            margin: 10px;
            padding: 15px;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            animation: fadeIn 0.8s ease-out;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-spacer"></div>
            <div class="header-buttons">
                <button id="records-button" class="settings-button" onclick="document.getElementById('records-panel').style.display='block';document.getElementById('main-content').style.display='none';">历史记录</button>
                <button id="settings-button" class="settings-button" onclick="document.getElementById('settings-panel').style.display='block';document.getElementById('main-content').style.display='none';">设置</button>
            </div>
        </header>

        <main id="main-content">
            <div class="lottery-container">
                <div class="female-section">
                    <h2 class="section-title female-color">女嘉宾</h2>
                    <div class="number female-number" id="female-number">001</div>
                </div>
                
                <div class="heart-animation" id="heart-match">❤</div>
                
                <div class="male-section">
                    <h2 class="section-title male-color">男嘉宾</h2>
                    <div class="number male-number" id="male-number">001</div>
                </div>
            </div>

            <div class="result-container" id="result-container" style="display: none;">
                <div class="result-title">抽取结果</div>
                <div class="result-content">
                <div class="result-text" id="result-text"></div>
                </div>
                <div class="result-actions">
                    <button class="cancel-button" onclick="handleReDrawButtonClick()">再次抽取</button>
                    <button class="save-button" onclick="closeResultModal()">关闭</button>
                </div>
            </div>
            
            <div class="controls">
                <button id="control-button" class="control-button white-button" onclick="handleControlButtonClick()">抽1组</button>
                <button id="batch-button" class="control-button batch-button" onclick="handleBatchButtonClick()">抽3组</button>
                <button id="reset-button" class="reset-button" onclick="resetAllAndRecords()" style="display: none;">重新开始</button>
            </div>
            
            <div id="records-container" class="records-container" style="display: none;">
                <div id="records-list" class="records-list"></div>
            </div>
        </main>

        <div id="records-panel" class="settings-panel" style="display: none;">
            <h2 class="settings-title">历史记录 <span class="records-count-badge">共 <span id="records-count">0</span> 条</span></h2>
            
            <div class="records-list-container">
                <div id="history-records-list" class="records-list"></div>
            </div>
            
            <div class="settings-buttons">
                <button id="clear-records" class="cancel-button" onclick="resetRecords()">清除记录</button>
                <button id="close-records" class="save-button" onclick="document.getElementById('records-panel').style.display='none';document.getElementById('main-content').style.display='flex';">返回</button>
            </div>
        </div>

        <div id="settings-panel" class="settings-panel" style="display: none;">
            <h2 class="settings-title">设置</h2>
            
            <div class="settings-group">
                <div class="settings-item">
                    <label>女生号码范围</label>
                    <div class="range-inputs">
                        <input type="number" id="female-min" min="1" value="1">
                        <span class="range-separator">到</span>
                        <input type="number" id="female-max" min="1" value="103">
                    </div>
                </div>
                
                <div class="settings-item">
                    <label>男生号码范围</label>
                    <div class="range-inputs">
                        <input type="number" id="male-min" min="1" value="1">
                        <span class="range-separator">到</span>
                        <input type="number" id="male-max" min="1" value="73">
                    </div>
                </div>
                
                <div class="settings-item">
                    <label>数字字号</label>
                    <input type="number" id="number-size" min="16" max="160" value="80">
                </div>
                
                <div class="settings-item">
                    <label>标签字号</label>
                    <input type="number" id="label-size" min="12" max="48" value="28">
                </div>
                
                <div class="settings-item">
                    <label>一次抽取组数</label>
                    <input type="number" id="batch-count" min="1" max="99" value="3">
                </div>
            </div>
            
            <div class="settings-buttons">
                <button id="save-settings" class="save-button" onclick="handleSaveSettings()">保存并返回</button>
                <button id="cancel-settings" class="cancel-button" onclick="document.getElementById('settings-panel').style.display='none';document.getElementById('main-content').style.display='flex';">取消</button>
            </div>
        </div>
    </div>

    <script>
        // 内联JavaScript，确保设置面板功能正常工作
        // 控制按钮状态
        let state = {
            rolling: false,
            rollInterval: null,
            selectedFemale: null,
            selectedMale: null,
            step: 0,  // 0: 初始状态, 1: 停止滚动, 2: 显示结果
        };
        
        // 用于存储抽取记录
        let matchRecords = [];
        // 已抽取的女生和男生号码
        let usedFemaleNumbers = new Set();
        let usedMaleNumbers = new Set();
        
        // 页面加载时从localStorage加载记录和更新批量按钮文本
        window.onload = function() {
            loadRecordsFromCache();
            updateBatchButtonText();
            applyFontSizeSettings();
            loadSettings();
        };
        
        // 应用字体大小设置
        function applyFontSizeSettings() {
            const savedSettings = JSON.parse(localStorage.getItem('matchingLotterySettings')) || {};
            
            if (savedSettings.fontSize) {
                // 设置号码大小
                if (savedSettings.fontSize.number) {
                    const numbers = document.querySelectorAll('.number');
                    numbers.forEach(number => {
                        number.style.fontSize = `${savedSettings.fontSize.number / 16}rem`;
                    });
                }
                
                // 设置标签字号
                if (savedSettings.fontSize.label) {
                    const titles = document.querySelectorAll('.section-title');
                    titles.forEach(title => {
                        title.style.fontSize = `${savedSettings.fontSize.label / 16}rem`;
                    });
                }
            }
        }
        
        // 从缓存加载记录
        function loadRecordsFromCache() {
            const savedRecords = localStorage.getItem('matchingLotteryRecords');
            if (savedRecords) {
                try {
                    matchRecords = JSON.parse(savedRecords);
                    
                    // 重建已使用号码集合
                    usedFemaleNumbers = new Set();
                    usedMaleNumbers = new Set();
                    
                    for (const record of matchRecords) {
                        usedFemaleNumbers.add(record.female);
                        usedMaleNumbers.add(record.male);
                    }
                    
                    // 显示记录
                    renderRecords();
                } catch (e) {
                    console.error('无法加载抽取记录:', e);
                }
            }
        }
        
        // 保存记录到缓存
        function saveRecordsToCache() {
            localStorage.setItem('matchingLotteryRecords', JSON.stringify(matchRecords));
        }
        
        // 渲染记录列表
        function renderRecords() {
            // 更新主界面的记录列表（如果存在）
            const mainRecordsList = document.getElementById('records-list');
            if (mainRecordsList) {
                mainRecordsList.innerHTML = '';
                
                if (matchRecords.length === 0) {
                    mainRecordsList.innerHTML = '<div class="no-records">暂无抽取记录</div>';
                }
                else {
                    renderRecordList(mainRecordsList, 5);
                }
            }
            
            // 更新历史记录面板的记录列表
            const historyRecordsList = document.getElementById('history-records-list');
            if (historyRecordsList) {
                historyRecordsList.innerHTML = '';
                
                if (matchRecords.length === 0) {
                    historyRecordsList.innerHTML = '<div class="no-records">暂无抽取记录</div>';
                }
                else {
                    renderRecordList(historyRecordsList, 5);
                }
            }
            
            // 更新记录数量显示
            const recordsCount = document.getElementById('records-count');
            if (recordsCount) {
                recordsCount.textContent = matchRecords.length;
            }
        }
        
        // 辅助函数：在指定容器中渲染记录列表
        function renderRecordList(container, itemsPerRow) {
            // 创建包装容器确保每行居中显示
            let rowWrapper = null;
            // 减少每行展示的记录数，避免挤压
            const actualItemsPerRow = Math.min(4, itemsPerRow);
            
            for (let i = 0; i < matchRecords.length; i++) {
                // 每行开始创建新的包装容器
                if (i % actualItemsPerRow === 0) {
                    rowWrapper = document.createElement('div');
                    rowWrapper.className = 'record-row';
                    rowWrapper.style.display = 'flex';
                    rowWrapper.style.justifyContent = 'center';
                    rowWrapper.style.width = '100%';
                    rowWrapper.style.flexWrap = 'wrap';
                    rowWrapper.style.marginBottom = '15px';
                    container.appendChild(rowWrapper);
                }
                
                const record = matchRecords[i];
                const recordItem = document.createElement('div');
                recordItem.className = 'record-item';
                
                // 添加日期显示
                const date = new Date(record.timestamp);
                const dateStr = `${date.getMonth()+1}/${date.getDate()} ${date.getHours()}:${date.getMinutes().toString().padStart(2, '0')}`;
                
                recordItem.innerHTML = `
                    <div><span style="color: #ff7b8a;">${formatNumberToThreeDigits(record.female)}</span> <span class="record-heart">❤</span> <span style="color: #4a9dcf;">${formatNumberToThreeDigits(record.male)}</span></div>
                    <div class="record-time">${dateStr}</div>
                `;
                rowWrapper.appendChild(recordItem);
            }
        }
        
        // 重置所有记录
        function resetRecords() {
            if (confirm('确定要清除所有抽取记录吗？')) {
                matchRecords = [];
                usedFemaleNumbers = new Set();
                usedMaleNumbers = new Set();
                saveRecordsToCache();
                renderRecords();
            }
        }
        
        // 控制按钮点击处理
        function handleControlButtonClick() {
            const controlButton = document.getElementById('control-button');
            const femaleNumber = document.getElementById('female-number');
            const maleNumber = document.getElementById('male-number');
            const resultContainer = document.getElementById('result-container');
            const resultText = document.getElementById('result-text');
            const savedSettings = JSON.parse(localStorage.getItem('matchingLotterySettings')) || {};
            const settings = {
                femaleRange: savedSettings.femaleRange || { min: 1, max: 103 },
                maleRange: savedSettings.maleRange || { min: 1, max: 73 }
            };
            
            switch (state.step) {
                case 0: // 开始滚动
                    state.rolling = true;
                    state.step = 1;
                    controlButton.textContent = '停止';
                    
                    state.rollInterval = setInterval(() => {
                        // 获取未使用的可用号码范围
                        const availableFemale = getAvailableNumbers(settings.femaleRange.min, settings.femaleRange.max, usedFemaleNumbers);
                        const availableMale = getAvailableNumbers(settings.maleRange.min, settings.maleRange.max, usedMaleNumbers);
                        
                        // 检查是否还有可用号码
                        if (availableFemale.length === 0 || availableMale.length === 0) {
                            clearInterval(state.rollInterval);
                            state.rollInterval = null;
                            alert('所有可能的配对都已抽取完毕！');
                            controlButton.textContent = '开始';
                            state.step = 0;
                            return;
                        }
                        
                        // 随机选择未使用的号码
                        const femaleRandomNumber = availableFemale[Math.floor(Math.random() * availableFemale.length)];
                        const maleRandomNumber = availableMale[Math.floor(Math.random() * availableMale.length)];
                        
                        // 格式化为三位数
                        femaleNumber.textContent = formatNumberToThreeDigits(femaleRandomNumber);
                        maleNumber.textContent = formatNumberToThreeDigits(maleRandomNumber);
                    }, 50);
                    break;
                    
                case 1: // 停止滚动
                    if (state.rollInterval) {
                        clearInterval(state.rollInterval);
                        state.rollInterval = null;
                    }
                    
                    state.rolling = false;
                    state.step = 2;
                    state.selectedFemale = parseInt(femaleNumber.textContent);
                    state.selectedMale = parseInt(maleNumber.textContent);
                    
                    // 禁用按钮，防止连续点击
                    controlButton.disabled = true;
                    
                    // 显示心形动画
                    const heartMatch = document.getElementById('heart-match');
                    heartMatch.classList.add('active');
                    
                    // 暂停1秒后显示结果并移除心形动画
                    setTimeout(() => {
                        // 移除心形动画
                        heartMatch.classList.remove('active');
                        
                        // 显示结果容器
                        resultContainer.style.display = 'flex';
                        
                        // 创建心形符号 - 使用batch-results格式显示单组结果
                        resultText.innerHTML = `
                        <div class="batch-results" style="justify-content:center;">
                            <div class="batch-result-item">
                                <span style="color: #ff7b8a;">${formatNumberToThreeDigits(state.selectedFemale)}</span><span style="display:inline-block; color: #ff4d7e; margin: 0 3px; font-weight: bold;">❤</span><span style="color: #4a9dcf;">${formatNumberToThreeDigits(state.selectedMale)}</span>
                            </div>
                        </div>`;
                        
                        // 恢复按钮状态
                        controlButton.disabled = false;
                        controlButton.textContent = '抽1组';
                        
                        // 显示重新开始按钮
                        document.getElementById('reset-button').style.display = 'inline-block';
                        
                        // 添加到抽取记录
                        usedFemaleNumbers.add(state.selectedFemale);
                        usedMaleNumbers.add(state.selectedMale);
                        matchRecords.push({
                            female: state.selectedFemale,
                            male: state.selectedMale,
                            timestamp: new Date().getTime()
                        });
                        
                        // 保存并显示记录
                        saveRecordsToCache();
                        renderRecords();
                        
                        // 动态调整标签大小
                        adjustBatchResultItemSize(1);
                    }, 1000);
                    break;
                    
                case 2: // 重新开始
                    state.step = 0;
                    state.selectedFemale = null;
                    state.selectedMale = null;
                    
                    // 关闭结果容器
                    closeResultModal();
                    
                    // 自动开始新的滚动
                    handleControlButtonClick();
                    break;
            }
        }
        
        function handleSaveSettings() {
            // 验证和获取输入值
            const femaleMin = Math.max(1, parseInt(document.getElementById('female-min').value) || 1);
            const femaleMax = Math.max(femaleMin, parseInt(document.getElementById('female-max').value) || 103);
            const maleMin = Math.max(1, parseInt(document.getElementById('male-min').value) || 1);
            const maleMax = Math.max(maleMin, parseInt(document.getElementById('male-max').value) || 73);
            
            const numberSize = Math.max(16, Math.min(160, parseInt(document.getElementById('number-size').value) || 80));
            const labelSize = Math.max(12, Math.min(48, parseInt(document.getElementById('label-size').value) || 28));
            const batchCount = Math.max(1, Math.min(99, parseInt(document.getElementById('batch-count').value) || 3));
            
            // 更新设置
            let settings = {
                femaleRange: { min: femaleMin, max: femaleMax },
                maleRange: { min: maleMin, max: maleMax },
                fontSize: {
                    number: numberSize,
                    label: labelSize
                },
                batchCount: batchCount
            };
            
            // 保存设置
            localStorage.setItem('matchingLotterySettings', JSON.stringify(settings));
            
            // 关闭设置面板
            document.getElementById('settings-panel').style.display = 'none';
            document.getElementById('main-content').style.display = 'flex';
            
            // 刷新页面以应用设置
            location.reload();
        }
        
        // 重新初始化整个程序
        function resetAll() {
            // 清除状态
            state = {
                rolling: false,
                rollInterval: null,
                selectedFemale: null,
                selectedMale: null,
                step: 0
            };
            
            // 重置UI
            const femaleNumber = document.getElementById('female-number');
            const maleNumber = document.getElementById('male-number');
            const resultContainer = document.getElementById('result-container');
            const controlButton = document.getElementById('control-button');
            
            femaleNumber.textContent = '001';
            maleNumber.textContent = '001';
            resultContainer.style.display = 'none';
            
            // 重置按钮
            controlButton.textContent = '抽1组';
            document.getElementById('reset-button').style.display = 'none';
        }
        
        // 获取未使用的可用号码
        function getAvailableNumbers(min, max, usedNumbers) {
            const available = [];
            for (let i = min; i <= max; i++) {
                if (!usedNumbers.has(i)) {
                    available.push(i);
                }
            }
            return available;
        }
        
        // 重新开始并重置记录
        function resetAllAndRecords() {
            if (confirm('确定要重新开始并清除所有抽取记录吗？')) {
                // 重置抽取记录
                matchRecords = [];
                usedFemaleNumbers = new Set();
                usedMaleNumbers = new Set();
                saveRecordsToCache();
                
                // 重置状态
                state = {
                    rolling: false,
                    rollInterval: null,
                    selectedFemale: null,
                    selectedMale: null,
                    step: 0
                };
                
                // 重置UI
                const femaleNumber = document.getElementById('female-number');
                const maleNumber = document.getElementById('male-number');
                const resultContainer = document.getElementById('result-container');
                const controlButton = document.getElementById('control-button');
                
                femaleNumber.textContent = '001';
                maleNumber.textContent = '001';
                resultContainer.style.display = 'none';
                document.getElementById('records-container').style.display = 'none';
                
                // 重置按钮
                controlButton.textContent = '抽1组';
                document.getElementById('reset-button').style.display = 'none';
            }
        }
        
        // 处理批量抽取按钮点击
        function handleBatchButtonClick() {
            if (state.rolling) return; // 如果正在滚动中则忽略
            
            const settings = JSON.parse(localStorage.getItem('matchingLotterySettings')) || {};
            const batchSettings = {
                femaleRange: settings.femaleRange || { min: 1, max: 103 },
                maleRange: settings.maleRange || { min: 1, max: 73 },
                batchCount: settings.batchCount || 3
            };
            
            // 获取未使用的可用号码范围
            const availableFemale = getAvailableNumbers(batchSettings.femaleRange.min, batchSettings.femaleRange.max, usedFemaleNumbers);
            const availableMale = getAvailableNumbers(batchSettings.maleRange.min, batchSettings.maleRange.max, usedMaleNumbers);
            
            // 检查是否有足够的可用号码
            if (availableFemale.length < batchSettings.batchCount || availableMale.length < batchSettings.batchCount) {
                alert(`可用号码不足，无法一次抽取${batchSettings.batchCount}组！\n女生号码剩余: ${availableFemale.length}\n男生号码剩余: ${availableMale.length}`);
                return;
            }
            
            // 禁用按钮，防止连续点击
            const batchButton = document.getElementById('batch-button');
            const controlButton = document.getElementById('control-button');
            batchButton.disabled = true;
            controlButton.disabled = true;
            
            // 模拟快速滚动显示
            let batchIndex = 0;
            const femaleNumber = document.getElementById('female-number');
            const maleNumber = document.getElementById('male-number');
            const resultContainer = document.getElementById('result-container');
            
            // 为每个抽取项添加滚动效果
            function startRollingNumbers(onComplete) {
                let rollingInterval = setInterval(() => {
                    // 获取所有未使用的号码范围（不考虑本次批量已选的号码）
                    const availableFemale = getAvailableNumbers(batchSettings.femaleRange.min, batchSettings.femaleRange.max, usedFemaleNumbers);
                    const availableMale = getAvailableNumbers(batchSettings.maleRange.min, batchSettings.maleRange.max, usedMaleNumbers);
                    
                    // 随机选择号码
                    const randomFemale = availableFemale[Math.floor(Math.random() * availableFemale.length)];
                    const randomMale = availableMale[Math.floor(Math.random() * availableMale.length)];
                    
                    // 显示当前随机号码
                    femaleNumber.textContent = formatNumberToThreeDigits(randomFemale);
                    maleNumber.textContent = formatNumberToThreeDigits(randomMale);
                }, 50);
                
                // 1秒后停止滚动并显示实际结果
                setTimeout(() => {
                    clearInterval(rollingInterval);
                    onComplete();
                }, 1000);
            }
            
            // 初始化结果文本：使用表格样式布局
            let resultHTML = '<div class="batch-results">';
            
            // 生成随机组合
            const matches = [];
            const tempUsedFemale = new Set([...usedFemaleNumbers]);
            const tempUsedMale = new Set([...usedMaleNumbers]);
            
            for (let i = 0; i < batchSettings.batchCount; i++) {
                // 获取当前可用号码
                const currentAvailableFemale = getAvailableNumbers(batchSettings.femaleRange.min, batchSettings.femaleRange.max, tempUsedFemale);
                const currentAvailableMale = getAvailableNumbers(batchSettings.maleRange.min, batchSettings.maleRange.max, tempUsedMale);
                
                // 随机选择号码
                const femaleIndex = Math.floor(Math.random() * currentAvailableFemale.length);
                const maleIndex = Math.floor(Math.random() * currentAvailableMale.length);
                
                const femaleNumber = currentAvailableFemale[femaleIndex];
                const maleNumber = currentAvailableMale[maleIndex];
                
                // 添加到临时已使用集合
                tempUsedFemale.add(femaleNumber);
                tempUsedMale.add(maleNumber);
                
                // 添加到结果
                matches.push({
                    female: femaleNumber,
                    male: maleNumber
                });
            }
            
            // 滚动显示
            function displayNextMatch() {
                if (batchIndex < matches.length) {
                    const match = matches[batchIndex];
                    
                    // 启动滚动效果，完成后继续下一对
                    startRollingNumbers(() => {
                        // 显示当前固定号码结果
                        femaleNumber.textContent = formatNumberToThreeDigits(match.female);
                        maleNumber.textContent = formatNumberToThreeDigits(match.male);
                        
                        // 显示心形动画
                        const heartMatch = document.getElementById('heart-match');
                        heartMatch.classList.add('active');
                        
                        // 暂停1秒后显示结果并移除心形动画
                        setTimeout(() => {
                            // 移除心形动画
                            heartMatch.classList.remove('active');
                            
                            // 添加到最终结果HTML
                            resultHTML += `<div class="batch-result-item">
                                <span style="color: #ff7b8a;">${formatNumberToThreeDigits(match.female)}</span><span style="display:inline-block; color: #ff4d7e; margin: 0 3px; font-weight: bold;">❤</span><span style="color: #4a9dcf;">${formatNumberToThreeDigits(match.male)}</span>
                            </div>`;
                            
                            // 添加到抽取记录
                            usedFemaleNumbers.add(match.female);
                            usedMaleNumbers.add(match.male);
                            matchRecords.push({
                                female: match.female,
                                male: match.male,
                                timestamp: new Date().getTime()
                            });
                            
                            // 处理下一对
                            batchIndex++;
                            setTimeout(displayNextMatch, 300);
                        }, 1000);
                    });
                } else {
                    // 所有结果显示完毕，收尾工作
                    resultHTML += '</div>';
                    
                    // 保存并显示记录
                    saveRecordsToCache();
                    renderRecords();
                    
                    // 显示结果容器
                    resultContainer.style.display = 'flex';
                    document.getElementById('result-text').innerHTML = resultHTML;
                    
                    // 动态调整标签大小
                    adjustBatchResultItemSize(matches.length);
                    
                    // 恢复按钮状态
                    batchButton.disabled = false;
                    controlButton.disabled = false;
                    
                    // 显示重新开始按钮
                    document.getElementById('reset-button').style.display = 'inline-block';
                }
            }
            
            // 开始显示
            displayNextMatch();
        }
        
        // 更新批量按钮文本
        function updateBatchButtonText() {
            const settings = JSON.parse(localStorage.getItem('matchingLotterySettings')) || {};
            const batchCount = settings.batchCount || 3;
            document.getElementById('batch-button').textContent = `抽${batchCount}组`;
        }
        
        // 关闭结果弹窗
        function closeResultModal() {
            const resultContainer = document.getElementById('result-container');
            resultContainer.style.display = 'none';
        }

        // 从缓存加载设置
        function loadSettings() {
            const settingsStr = localStorage.getItem('matchingLotterySettings');
            if (settingsStr) {
                const settings = JSON.parse(settingsStr);
                
                if (settings.femaleRange) {
                    document.getElementById('female-min').value = settings.femaleRange.min;
                    document.getElementById('female-max').value = settings.femaleRange.max;
                }
                
                if (settings.maleRange) {
                    document.getElementById('male-min').value = settings.maleRange.min;
                    document.getElementById('male-max').value = settings.maleRange.max;
                }
                
                if (settings.fontSize) {
                    document.getElementById('number-size').value = settings.fontSize.number;
                    document.getElementById('label-size').value = settings.fontSize.label;
                }
                
                if (settings.batchCount) {
                    document.getElementById('batch-count').value = settings.batchCount;
                    // 更新批量抽取按钮文本
                    document.getElementById('batch-button').textContent = `抽${settings.batchCount}组`;
                }
            }
        }

        // 动态调整标签大小
        function adjustBatchResultItemSize(matchCount) {
            const batchResults = document.querySelector('.batch-results');
            if (batchResults) {
                const batchResultItems = batchResults.querySelectorAll('.batch-result-item');
                
                // 根据结果数量动态调整字体大小和内边距
                let fontSize, padding, minWidth, height;
                
                if (matchCount === 1) {
                    // 单个结果时使用最大尺寸
                    fontSize = 5.5;
                    padding = "25px 45px";
                    minWidth = "300px";
                    height = "120px";
                } else if (matchCount <= 3) {
                    // 2-3个结果使用较大尺寸
                    fontSize = 4.2;
                    padding = "20px 40px";
                    minWidth = "260px";
                    height = "110px";
                } else if (matchCount <= 6) {
                    // 4-6个结果使用中等尺寸
                    fontSize = 3.6;
                    padding = "15px 30px";
                    minWidth = "230px";
                    height = "100px";
                } else {
                    // 7个及以上结果使用较小尺寸
                    fontSize = 3.0;
                    padding = "12px 25px";
                    minWidth = "210px";
                    height = "90px";
                }
                
                // 应用样式到所有结果项
                batchResultItems.forEach(item => {
                    item.style.fontSize = `${fontSize}rem`;
                    item.style.padding = padding;
                    item.style.minWidth = minWidth;
                    item.style.height = height;
                });
            }
        }
        
        // 辅助函数：将数字格式化为三位数
        function formatNumberToThreeDigits(number) {
            return number.toString().padStart(3, '0');
        }
        
        // 处理"再次抽取"按钮点击
        function handleReDrawButtonClick() {
            // 先关闭结果弹窗
            closeResultModal();
            
            // 判断上次是单次抽取还是批量抽取
            const settings = JSON.parse(localStorage.getItem('matchingLotterySettings')) || {};
            const batchCount = settings.batchCount || 3;
            
            // 检查最后一次记录的时间戳，如果和其他几条记录时间相近，说明是批量抽取
            if (matchRecords.length >= 2) {
                let lastRecordTime = matchRecords[matchRecords.length - 1].timestamp;
                let secondLastRecordTime = matchRecords[matchRecords.length - 2].timestamp;
                
                // 如果两次记录时间差小于2秒，认为是批量抽取
                if (lastRecordTime - secondLastRecordTime < 2000) {
                    // 执行批量抽取
                    setTimeout(function() {
                        handleBatchButtonClick();
                    }, 300);
                    return;
                }
            }
            
            // 单次抽取
            setTimeout(function() {
                handleControlButtonClick();
            }, 300);
        }
    </script>
