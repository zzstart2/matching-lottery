<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>相亲活动摇号系统</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap">
    <link rel="icon" href="img/heart.png">
    <style>
        .session-note {
            text-align: center;
            margin-top: 10px;
            color: #777;
            font-size: 14px;
            font-style: italic;
        }
        .controls {
            text-align: center;
            margin-top: 20px;
            padding-bottom: 20px;
        }
        
        /* 记录容器样式 */
        .records-container {
            margin-top: 20px;
            width: 90%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 20px 40px 20px;
        }
        
        .records-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            width: 100%;
            max-width: 1000px;
        }
        
        .record-item {
            background: linear-gradient(45deg, rgba(255, 182, 193, 0.4), rgba(135, 206, 235, 0.4));
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 1.2rem;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            display: inline-flex;
            align-items: center;
            min-width: 70px;
            justify-content: center;
            margin: 3px;
        }
        
        .record-heart {
            color: #ff4d7e;
            margin: 0 5px;
        }
        
        /* 限制每行最多10个标签 */
        .record-item:nth-child(10n+1) {
            page-break-after: always;
            break-after: always;
        }
        
        /* 针对10:4屏幕比例的特殊样式 */
        @media (min-aspect-ratio: 9/4) {
            body {
                background: linear-gradient(135deg, #ffdbea 0%, #cee5ff 100%);
                padding: 0;
                margin: 0;
                height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                overflow: hidden;
            }
            
            /* 整体容器调整 */
            .container {
                width: 90%;
                height: 80vh;
                max-height: 800px;
                margin: 0 auto;
                display: flex;
                flex-direction: column;
                justify-content: center;
                border-radius: 20px;
                box-shadow: 0 10px 50px rgba(0, 0, 0, 0.2);
                background-color: rgba(255, 255, 255, 0.7);
                padding: 20px;
            }
            
            /* 头部样式增强 */
            header {
                margin-bottom: 30px;
                display: flex;
                justify-content: flex-end;
                padding: 20px;
            }
            
            .header-spacer {
                flex-grow: 1;
            }
            
            .settings-button {
                cursor: pointer;
                padding: 8px 15px;
                font-size: 16px;
                border-radius: 5px;
                background-color: #f0f0f0;
                border: 1px solid #ddd;
                transition: all 0.3s;
                z-index: 100;
            }
            
            .settings-button:hover {
                background-color: #e0e0e0;
            }
            
            /* 抽奖容器横向布局调整 */
            .lottery-container {
                display: flex;
                justify-content: center;
                gap: 15%;
                margin: 0 auto;
                width: 100%;
                height: 60%;
            }
            
            /* 女生和男生区域尺寸调整 */
            .female-section, .male-section {
                width: 35%;
                padding: 40px;
                border-radius: 20px;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                box-shadow: 0 5px 25px rgba(0, 0, 0, 0.1);
            }
            
            .female-section {
                background-color: rgba(255, 182, 193, 0.4);
            }
            
            .male-section {
                background-color: rgba(135, 206, 235, 0.4);
            }
            
            /* 号码显示调整 */
            .number {
                width: 250px;
                height: 250px;
                line-height: 250px; /* 使数字垂直居中 */
                font-size: 8rem !important;
                font-weight: 700;
                margin: 30px auto;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            }
            
            /* 标题调整 */
            .title {
                font-size: 4.5rem !important;
                text-align: center;
                font-weight: 700;
                margin-bottom: 20px;
                background: linear-gradient(45deg, #ff4d7e, #4785ba);
                -webkit-background-clip: text;
                background-clip: text;
                color: transparent;
                text-shadow: 0 2px 5px rgba(0,0,0,0.1);
            }
            
            /* 分区标题调整 */
            .section-title {
                font-size: 2.5rem !important;
                margin-bottom: 20px;
                font-weight: 700;
            }
            
            /* 控制按钮调整 */
            .control-button {
                font-size: 2.5rem;
                padding: 20px 0;
                margin-top: 0;
                border-radius: 50px;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
                font-weight: 600;
                letter-spacing: 5px;
                width: 300px;
                position: relative;
                text-align: center;
                transition: background-color 0.3s;
                display: inline-block;
            }
            
            /* 控制容器固定尺寸 */
            .controls {
                height: 120px;
                display: flex;
                justify-content: center;
                align-items: center;
                margin-top: 60px;
                gap: 20px;
            }
            
            /* 重新开始按钮样式 - 链接样式 */
            .reset-button {
                font-size: 1.5rem;
                margin-top: 0;
                margin-left: 20px;
                font-weight: 500;
                text-align: center;
                transition: all 0.3s;
                display: none;
                background: none;
                color: #777;
                border: none;
                cursor: pointer;
                text-decoration: underline;
                padding: 5px 10px;
            }
            
            .reset-button:hover {
                color: #f44336;
                text-decoration: underline;
            }
            
            /* 结果容器调整，避免影响布局 */
            .result-container {
                height: 60%;
                position: absolute;
                top: 40%;
                left: 50%;
                transform: translate(-50%, -50%);
                width: 80%;
                display: flex;
                justify-content: center;
                align-items: center;
            }
            
            .result-text {
                font-size: 7rem !important;
                font-weight: 700;
                background: linear-gradient(45deg, #ff4d7e, #4785ba);
                -webkit-background-clip: text;
                background-clip: text;
                color: transparent;
                text-shadow: 0 5px 10px rgba(0,0,0,0.1);
            }
            
            /* 设置面板调整 */
            .settings-panel {
                position: fixed;
                width: 60%;
                height: auto;
                max-height: 80vh;
                left: 20%;
                top: 5vh;
                border-radius: 20px;
                box-shadow: 0 10px 50px rgba(0, 0, 0, 0.3);
                background-color: white;
                z-index: 1000;
                padding: 30px;
                overflow-y: auto;
                display: flex;
                flex-direction: column;
            }
            
            #settings-panel {
                display: none;
            }
            
            .settings-title {
                font-size: 3.5rem !important;
                margin-bottom: 40px;
            }
            
            .settings-group {
                display: flex;
                flex-wrap: wrap;
                justify-content: space-around;
                align-items: center;
            }
            
            .settings-item {
                margin-bottom: 30px;
                font-size: 2rem;
                padding: 0 15px;
                box-sizing: border-box;
                width: 80%;
            }
            
            .settings-item input {
                width: 150px;
                height: 60px;
                font-size: 2rem;
                text-align: center;
            }
            
            .range-separator {
                font-size: 2rem;
                margin: 0 20px;
            }
            
            .settings-buttons {
                margin-top: 20px;
                margin-bottom: 20px;
                display: flex;
                justify-content: center;
                gap: 30px;
                position: sticky;
                bottom: 0;
                background-color: transparent;
                padding: 15px 0;
            }
            
            .save-button, .cancel-button {
                padding: 15px 40px;
                font-size: 1.8rem;
                border-radius: 10px;
                cursor: pointer;
            }
            
            .save-button {
                background-color: #4CAF50;
                color: white;
                border: none;
            }
            
            .cancel-button {
                background-color: #f44336;
                color: white;
                border: none;
            }
            
            /* 针对超宽屏幕(如2700*1080)的额外优化 */
            @media (min-width: 2400px) {
                .settings-panel {
                    width: 50%;
                    left: 25%;
                    max-height: 70vh;
                }
                
                .settings-item {
                    width: 80%;
                    margin-bottom: 20px;
                }
                
                .settings-title {
                    margin-bottom: 30px;
                }
                
                /* 超宽屏下记录容器优化 */
                .records-container {
                    margin-top: 10px;
                    padding-bottom: 60px;
                    max-width: 80%;
                }
                
                .records-list {
                    max-height: 200px;
                    overflow-y: auto;
                    justify-content: flex-start;
                    padding: 10px;
                }
                
                .record-item {
                    margin: 5px;
                }
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-spacer"></div>
            <button id="settings-button" class="settings-button" onclick="document.getElementById('settings-panel').style.display='block';document.getElementById('main-content').style.display='none';">设置</button>
        </header>

        <main id="main-content">
            <div class="lottery-container">
                <div class="female-section">
                    <h2 class="section-title female-color">女生号码</h2>
                    <div class="number female-number" id="female-number">1</div>
                </div>
                
                <div class="male-section">
                    <h2 class="section-title male-color">男生号码</h2>
                    <div class="number male-number" id="male-number">1</div>
                </div>
            </div>

            <div class="result-container" id="result-container" style="display: none;">
                <div class="result-text" id="result-text"></div>
            </div>
            
            <div class="controls">
                <button id="control-button" class="control-button" onclick="handleControlButtonClick()">开始</button>
                <button id="reset-button" class="reset-button" onclick="resetAll()" style="display: none;">重新开始</button>
                <button id="clear-records-button" class="reset-button" onclick="resetRecords()" style="display: none;">重置记录</button>
            </div>
            
            <div id="records-container" class="records-container" style="display: none;">
                <div id="records-list" class="records-list"></div>
            </div>
        </main>

        <div id="settings-panel" class="settings-panel" style="display: none;">
            <h2 class="settings-title">设置</h2>
            
            <div class="settings-group">
                <div class="settings-item">
                    <label>女生号码范围</label>
                    <div class="range-inputs">
                        <input type="number" id="female-min" min="1" value="1">
                        <span class="range-separator">到</span>
                        <input type="number" id="female-max" min="1" value="103">
                    </div>
                </div>
                
                <div class="settings-item">
                    <label>男生号码范围</label>
                    <div class="range-inputs">
                        <input type="number" id="male-min" min="1" value="1">
                        <span class="range-separator">到</span>
                        <input type="number" id="male-max" min="1" value="73">
                    </div>
                </div>
                
                <div class="settings-item">
                    <label>数字字号</label>
                    <input type="number" id="number-size" min="16" max="160" value="80">
                </div>
                
                <div class="settings-item">
                    <label>标签字号</label>
                    <input type="number" id="label-size" min="12" max="48" value="28">
                </div>
            </div>
            
            <div class="settings-buttons">
                <button id="save-settings" class="save-button" onclick="handleSaveSettings()">保存并返回</button>
                <button id="cancel-settings" class="cancel-button" onclick="document.getElementById('settings-panel').style.display='none';document.getElementById('main-content').style.display='flex';">取消</button>
            </div>
        </div>
    </div>

    <script>
        // 内联JavaScript，确保设置面板功能正常工作
        // 控制按钮状态
        let state = {
            rolling: false,
            rollInterval: null,
            selectedFemale: null,
            selectedMale: null,
            step: 0,  // 0: 初始状态, 1: 停止滚动, 2: 显示结果
        };
        
        // 用于存储抽取记录
        let matchRecords = [];
        // 已抽取的女生和男生号码
        let usedFemaleNumbers = new Set();
        let usedMaleNumbers = new Set();
        
        // 页面加载时从localStorage加载记录
        window.onload = function() {
            loadRecordsFromCache();
        };
        
        // 从缓存加载记录
        function loadRecordsFromCache() {
            const savedRecords = localStorage.getItem('matchingLotteryRecords');
            if (savedRecords) {
                try {
                    matchRecords = JSON.parse(savedRecords);
                    
                    // 重建已使用号码集合
                    usedFemaleNumbers = new Set();
                    usedMaleNumbers = new Set();
                    
                    for (const record of matchRecords) {
                        usedFemaleNumbers.add(record.female);
                        usedMaleNumbers.add(record.male);
                    }
                    
                    // 显示记录
                    renderRecords();
                } catch (e) {
                    console.error('无法加载抽取记录:', e);
                }
            }
        }
        
        // 保存记录到缓存
        function saveRecordsToCache() {
            localStorage.setItem('matchingLotteryRecords', JSON.stringify(matchRecords));
        }
        
        // 渲染记录列表
        function renderRecords() {
            const recordsList = document.getElementById('records-list');
            recordsList.innerHTML = '';
            
            if (matchRecords.length === 0) {
                document.getElementById('records-container').style.display = 'none';
                document.getElementById('clear-records-button').style.display = 'none';
                return;
            }
            
            document.getElementById('records-container').style.display = 'flex';
            document.getElementById('clear-records-button').style.display = 'inline-block';
            
            for (const record of matchRecords) {
                const recordItem = document.createElement('div');
                recordItem.className = 'record-item';
                recordItem.innerHTML = `${record.female} <span class="record-heart">❤</span> ${record.male}`;
                recordsList.appendChild(recordItem);
            }
        }
        
        // 重置所有记录
        function resetRecords() {
            if (confirm('确定要清除所有抽取记录吗？')) {
                matchRecords = [];
                usedFemaleNumbers = new Set();
                usedMaleNumbers = new Set();
                saveRecordsToCache();
                renderRecords();
            }
        }
        
        // 控制按钮点击处理
        function handleControlButtonClick() {
            const controlButton = document.getElementById('control-button');
            const femaleNumber = document.getElementById('female-number');
            const maleNumber = document.getElementById('male-number');
            const resultContainer = document.getElementById('result-container');
            const resultText = document.getElementById('result-text');
            const settings = JSON.parse(localStorage.getItem('matchingLotterySettings')) || {
                femaleRange: { min: 1, max: 103 },
                maleRange: { min: 1, max: 73 }
            };
            
            switch (state.step) {
                case 0: // 开始滚动
                    state.rolling = true;
                    state.step = 1;
                    controlButton.textContent = '停止';
                    
                    state.rollInterval = setInterval(() => {
                        // 获取未使用的可用号码范围
                        const availableFemale = getAvailableNumbers(settings.femaleRange.min, settings.femaleRange.max, usedFemaleNumbers);
                        const availableMale = getAvailableNumbers(settings.maleRange.min, settings.maleRange.max, usedMaleNumbers);
                        
                        // 检查是否还有可用号码
                        if (availableFemale.length === 0 || availableMale.length === 0) {
                            clearInterval(state.rollInterval);
                            state.rollInterval = null;
                            alert('所有可能的配对都已抽取完毕！');
                            controlButton.textContent = '开始';
                            state.step = 0;
                            return;
                        }
                        
                        // 随机选择未使用的号码
                        const femaleRandomNumber = availableFemale[Math.floor(Math.random() * availableFemale.length)];
                        const maleRandomNumber = availableMale[Math.floor(Math.random() * availableMale.length)];
                        
                        femaleNumber.textContent = femaleRandomNumber;
                        maleNumber.textContent = maleRandomNumber;
                    }, 50);
                    break;
                    
                case 1: // 停止滚动
                    if (state.rollInterval) {
                        clearInterval(state.rollInterval);
                        state.rollInterval = null;
                    }
                    
                    state.rolling = false;
                    state.step = 2;
                    state.selectedFemale = parseInt(femaleNumber.textContent);
                    state.selectedMale = parseInt(maleNumber.textContent);
                    
                    // 禁用按钮，防止连续点击
                    controlButton.disabled = true;
                    
                    // 暂停1秒后显示结果
                    setTimeout(() => {
                        // 显示结果容器，但不隐藏抽奖容器
                        document.querySelector('.lottery-container').style.opacity = '0.2';
                        resultContainer.style.display = 'flex';
                        
                        // 创建心形符号
                        resultText.innerHTML = `${state.selectedFemale} <span style="color: #ff4d7e;">❤</span> ${state.selectedMale}`;
                        
                        // 恢复按钮状态
                        controlButton.disabled = false;
                        controlButton.textContent = '再抽一对';
                        
                        // 显示重新开始按钮
                        document.getElementById('reset-button').style.display = 'inline-block';
                        
                        // 添加到抽取记录
                        usedFemaleNumbers.add(state.selectedFemale);
                        usedMaleNumbers.add(state.selectedMale);
                        matchRecords.push({
                            female: state.selectedFemale,
                            male: state.selectedMale,
                            timestamp: new Date().getTime()
                        });
                        
                        // 保存并显示记录
                        saveRecordsToCache();
                        renderRecords();
                    }, 1000);
                    break;
                    
                case 2: // 重新开始
                    state.step = 0;
                    state.selectedFemale = null;
                    state.selectedMale = null;
                    
                    // 重置UI
                    document.querySelector('.lottery-container').style.opacity = '1';
                    resultContainer.style.display = 'none';
                    
                    // 自动开始新的滚动
                    handleControlButtonClick();
                    break;
            }
        }
        
        function handleSaveSettings() {
            // 验证和获取输入值
            const femaleMin = Math.max(1, parseInt(document.getElementById('female-min').value) || 1);
            const femaleMax = Math.max(femaleMin, parseInt(document.getElementById('female-max').value) || 103);
            const maleMin = Math.max(1, parseInt(document.getElementById('male-min').value) || 1);
            const maleMax = Math.max(maleMin, parseInt(document.getElementById('male-max').value) || 73);
            
            const numberSize = Math.max(16, Math.min(160, parseInt(document.getElementById('number-size').value) || 80));
            const labelSize = Math.max(12, Math.min(48, parseInt(document.getElementById('label-size').value) || 28));
            
            // 更新设置
            let settings = {
                femaleRange: { min: femaleMin, max: femaleMax },
                maleRange: { min: maleMin, max: maleMax },
                fontSize: {
                    number: numberSize,
                    label: labelSize
                }
            };
            
            // 保存设置
            localStorage.setItem('matchingLotterySettings', JSON.stringify(settings));
            
            // 关闭设置面板
            document.getElementById('settings-panel').style.display = 'none';
            document.getElementById('main-content').style.display = 'flex';
            
            // 刷新页面以应用设置
            location.reload();
        }
        
        // 重新初始化整个程序
        function resetAll() {
            // 清除状态
            state = {
                rolling: false,
                rollInterval: null,
                selectedFemale: null,
                selectedMale: null,
                step: 0
            };
            
            // 重置UI
            const femaleNumber = document.getElementById('female-number');
            const maleNumber = document.getElementById('male-number');
            const resultContainer = document.getElementById('result-container');
            const controlButton = document.getElementById('control-button');
            
            femaleNumber.textContent = '1';
            maleNumber.textContent = '1';
            document.querySelector('.lottery-container').style.opacity = '1';
            resultContainer.style.display = 'none';
            
            // 重置按钮
            controlButton.textContent = '开始';
            document.getElementById('reset-button').style.display = 'none';
        }
        
        // 获取未使用的可用号码
        function getAvailableNumbers(min, max, usedNumbers) {
            const available = [];
            for (let i = min; i <= max; i++) {
                if (!usedNumbers.has(i)) {
                    available.push(i);
                }
            }
            return available;
        }
    </script>
</body>
</html>
